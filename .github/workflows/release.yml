name: Release

# v로 시작하는 태그를 push하면 Windows / macOS / Linux 설치 파일을 만들어 GitHub Releases에 올린다.
#   git tag v0.1.0 && git push origin v0.1.0
# 순서: 초안 하나를 먼저 만든다 → 세 OS가 그 초안에 올린다 → 모두 끝나면 공개한다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 세 OS 빌드가 동시에 각자 초안을 만들면 초안이 둘로 갈라진다 (v0.3.4에서 Linux만 따로 올라감). 먼저 하나를 만들어 둔다.
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 세 OS 빌드가 모두 올라간 뒤에 공개한다. 먼저 공개하면 앱이 아직 없는 latest.yml을 찾다 404가 난다.
  # 한 OS라도 실패하면 이 단계가 돌지 않아 초안으로 남는다 (반쪽짜리 릴리즈를 내보내지 않음).
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
